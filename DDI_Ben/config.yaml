# Configuration file for running DDI models on Kaggle
# Simply set enabled: true/false to run/skip models

wandb:
  entity: "tunglamngo-univesity-of-engineering-and-technology-vnu"
  project: "DDI_NCKH_2025"
  wandb_key: "c4816b32f37419d7d62dc261260293cdfb9d7190"

# ============================================================================
# MODELS CONFIGURATION
# Edit 'enabled' to true/false to run/skip each model
# Edit 'wandb_name' to change run name on Wandb
# Edit 'args' to customize hyperparameters
# ============================================================================

models:
  # DDI_Ben models
  MLP:
    enabled: false # ← Change to true to run
    type: "ddi_ben"
    wandb_name: "MLP_DrugBank"
    args:
      dataset: "drugbank"
      dataset_type: "cluster"
      lr: 0.0003
      weight_decay: 0.00001
      epoch: 100
      batch_size: 128
      gpu: 0
      seed: 124
      eval_skip: 1
      patience: 10
      mlp_dropout: 0.1
      mlp_dim: 200
      use_feat: 1

