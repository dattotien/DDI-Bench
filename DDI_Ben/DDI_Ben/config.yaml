# DDI Prediction Configuration for MSTE, SSI-DDI, MLP and SAGAN models

# General hyperparameters
model: "SAGAN" # choices: ['MSTE', 'SSI-DDI', 'MLP', 'SAGAN']
name: "testrun" # Run name for saving/restoring models

# Dataset settings
# Mỗi dataset tự khai shape / task / file của nó trong dataset_registry.py,
# nên đổi dataset ở đây (hoặc --dataset) là đủ, không cần sửa path bên dưới.
dataset: "drugbank" # choices: ['drugbank', 'mecddi', 'mudi', 'twosides']
dataset_type: "cluster" # choices: ['random', 'cluster']

# Training parameters
gpu: 2
lr: 0.0003 # learning rate
weight_decay: 0.00001 # 1e-5
lbl_smooth: 0.0 # Label smoothing
epoch: 1 # training epochs
batch_size: 128
use_feat: 1 # Whether to use drug features (will be set to 0 for MSTE automatically)

# Experiment settings
seed: 124 # Random seed for reproducibility
eval_skip: 1 # Evaluate every x epochs
patience: 10 # Patience for early stopping

# MSTE model parameters (only used when model='MSTE')
kge_dim: 200 # hidden dimension for MSTE
kge_gamma: 1 # gamma parameter for MSTE
kge_dropout: 0.0 # dropout rate for MSTE
kge_loss: "BCE_mean" # loss function for MSTE

# MLP model parameters (only used when model='MLP')
mlp_dropout: 0.1 # dropout rate for MLP
mlp_dim: 200 # hidden dimension for MLP

# SAGAN model parameters (only used when model='SAGAN')
# SAGAN uses SSI-DDI backbone + CDAN adversarial domain adaptation
# adversarial flag is set automatically based on model choice (no need to change)
adversarial: 0 # set automatically: 1 for SAGAN, 0 for others

# Output directories (dataset-independent).
# Các đường dẫn theo dataset (train/valid/test, feature, SMILES) và label mapping
# đều lấy từ dataset_registry.py, không khai ở đây nữa -- nếu khai lại thì đổi
# dataset sẽ không đổi được data.
paths:
  checkpoint_dir: "./checkpoints"
  record_dir: "./record"

