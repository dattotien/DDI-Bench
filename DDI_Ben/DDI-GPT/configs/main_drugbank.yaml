max_length: 64
model_type: "roberta_cls"
# choices: drugbank | mecddi | mudi  (num_labels is taken from
# DDI_Ben/DDI_Ben/dataset_registry.py, so nothing else needs changing here)
dataset: "drugbank"
split_strategy: "cluster"
pretrained_model_path: "microsoft/biogpt"
# Split files and drug names/descriptions are located from `dataset`:
#   <data_root>/<dataset>_<split_strategy>/<state>.txt
#   <data_root>/<dataset>/drug_DDI_GPT.json
# data_root defaults to DDI-GPT's own data/, falling back to DDI_Ben/DDI_Ben/data/
# (where the mecddi and mudi splits live). Set it only to override both.
data_root: ""
annotation: ""
drug_name_only: True ## this is changed
use_zero_shot: True
use_few_shot: False
shot_num: 5
use_id: False
drug_only_max_length: 48
not_random: False
checkpoint: "./checkpoints/06-12/drugbank_0shot_seed2023_env0_re/checkpoint_epoch14.pt" # TODO
resume: False
use_gpu: True
multi_gpu: False
deepspeed: False
gpuid: "0"
gpu_num: 1
eval: False
test: True
filemode: "w"
patience: 5
num_train_epochs: 100

# --- how much work per epoch ---
# eval_skip: run validation every N epochs (1 = every epoch). The final epoch
#   always validates. MUDI has ~114k rows in each of its three valid sets, so
#   evaluating every epoch there costs more than the training does.
# max_eval_pairs: cap the rows used per validation set (0 = all). For a
#   directed_eval dataset (MUDI) this counts *pairs*, and rows i / i+N/2 are
#   always kept together so the forward/inverse pairing stays intact.
# max_train_steps: cap the batches per epoch (0 = the whole split).
# max_test_pairs: same cap for the final test pass; leave at 0 so reported
#   results cover the whole test file.
eval_skip: 1
max_eval_pairs: 0
max_train_steps: 0
max_test_pairs: 0
per_gpu_train_batch_size: 32
gradient_accumulation_steps: 1
eval_batch_size: 128
log_step: 10
lr_scheduler_type: "constant" # constant cosine
fp16: False
lr: 3.0e-6
weight_decay: 1.0e-6 # 1.0e-6 #1e-2
epsilon: 1.0e-8
vocab_size: 50257
seed: 15
